<?xml version="1.0" standalone="yes"?>
<driconf>
    <device>
        <!-- Debian 11 Xorg 1.20.11 glamor emits precision qualifiers in
             shaders without a #version directive. Mesa 25 otherwise parses
             them as GLSL 1.10 and terminates Xorg on the compile failure. -->
        <application name="Debian 11 Xorg glamor" executable="Xorg">
            <option name="force_glsl_version" value="130" />
        </application>
    </device>
</driconf>
