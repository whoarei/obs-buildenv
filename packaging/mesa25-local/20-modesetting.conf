Section "Device"
    Identifier  "Rockchip Graphics"
    Driver      "modesetting"

    # DRI3 requires glamor. The package depends on Debian's corrected Xorg
    # 1.20.11 security update; do not use the BSP modesetting driver containing
    # the Rockchip FlipFB extension, which corrupts window expose/copy output.
    # Keep page flips disabled on this RK3588 kernel/display-controller stack.
    Option      "AccelMethod"    "glamor"
    Option      "DRI"            "3"
    Option      "SWcursor"       "true"
    Option      "PageFlip"       "false"
    Option      "ShadowFB"       "false"
    Option      "UseGammaLUT"    "true"
EndSection

Section "Screen"
    Identifier  "Default Screen"
    Device      "Rockchip Graphics"
    Monitor     "Default Monitor"
EndSection

Section "Monitor"
    Identifier  "Default Monitor"
    Option      "Rotate" "normal"
EndSection
