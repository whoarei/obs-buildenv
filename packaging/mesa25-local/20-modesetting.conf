Section "Device"
    Identifier  "Rockchip Graphics"
    Driver      "modesetting"

    # Mesa 25 Panfrost renders EGL/GLES applications normally, but Debian 11
    # Xorg 1.20 glamor does not composite its cursor into RK3588 scanout.
    # Keep the X server on its stable software 2D path so the pointer remains
    # visible; applications still use Panfrost hardware acceleration.
    Option      "AccelMethod"    "none"
    Option      "SWcursor"       "true"
    Option      "PageFlip"       "false"
    Option      "ShadowFB"       "true"

    Option      "DRI"            "2"
    Option      "UseGammaLUT"    "true"
EndSection

Section "Screen"
    Identifier  "Default Screen"
    Device      "Rockchip Graphics"
    Monitor     "Default Monitor"
EndSection

Section "Monitor"
    Identifier  "Default Monitor"
    Option      "Rotate" "normal"
EndSection
