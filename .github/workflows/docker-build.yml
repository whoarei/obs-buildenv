name: docker-build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Mesa 25.0.7 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch mesa-25.0.7 \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa-source
          test "$(cat mesa-source/VERSION)" = 25.0.7
          test "$(git -C mesa-source rev-parse HEAD)" = \
            742a20f48c59e8649533c84c4d49dd95b403f5da

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export debs
        id: debs
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            mesa_source=./mesa-source
          platforms: linux/arm64
          target: debs
          outputs: type=local,dest=out
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push obs-builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            mesa_source=./mesa-source
          platforms: linux/arm64
          target: obs-builder
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}:latest', github.repository) || '' }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ github.ref_name }}
          path: out/

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          find out -type f -name '*.deb' -exec cp -v '{}' release/ ';'
          (cd release && sha256sum *.deb > SHA256SUMS)

      - name: Publish debs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
